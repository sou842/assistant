<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Browser Companion</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0a0a;
    }
    #nextjsFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #sandboxFrame {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Next.js Hosted UI -->
  <iframe id="nextjsFrame" allow="clipboard-read; clipboard-write"></iframe>
  
  <!-- Sandbox Execution Environment -->
  <iframe id="sandboxFrame" src="sandbox.html"></iframe>
  
  <script src="sidepanel.js"></script>
</body>
</html>
