<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Microphone Permission Required</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      background: #121212;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    h2 { margin-top: 0; margin-bottom: 12px; font-size: 20px; font-weight: 600; }
    p { color: #a0a0a0; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .btn {
      background: #1396d2;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1396d2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Microphone Access Required</h2>
    <p>Jarvis needs microphone access to enable voice commands. Please click the button below and select "Allow" when prompted by your browser.</p>
    <button id="requestBtn" class="btn">Grant Microphone Permission</button>
  </div>
  <script src="permission.js"></script>
</body>
</html>
